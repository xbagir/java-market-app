spring.application.name=payment-service

# HTTP-сервис платежей (отдельный порт от витрины)
server.port=${SERVER_PORT:8081}

# Стартовый баланс счёта покупателя (счёт создаётся при первом обращении)
app.payments.initial-balance=${INITIAL_BALANCE:100000}

# OAuth2 Resource Server: JWT валидируется по публичным ключам сервиса авторизации
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
