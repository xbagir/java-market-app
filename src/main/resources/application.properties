spring.application.name=my-market-app

# База данных
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:market;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# HTTP-сервер
server.port=${APP_PORT:8080}

# Загрузка демонстрационных данных в пустую витрину
app.seed.enabled=${SEED_DATABASE:true}

# Активный профиль по умолчанию
spring.profiles.active=dev
