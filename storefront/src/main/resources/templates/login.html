<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Вход — Витрина магазина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container p-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <h2 class="mb-4">
                    <span class="badge text-bg-success">Витрина магазина</span>
                </h2>
                <div class="alert alert-success" role="alert" th:if="${param.registered}">
                    Регистрация прошла успешно. Войдите, пожалуйста.
                </div>
                <div class="alert alert-success" role="alert" th:if="${param.logout}">
                    Вы вышли из системы.
                </div>
                <div class="alert alert-danger" role="alert" th:if="${param.error}">
                    Неверное имя пользователя или пароль.
                </div>
                <form method="post" th:action="@{/login}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-3">
                        <label for="username" class="form-label">Имя пользователя</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Войти</button>
                </form>
                <p class="mt-3 text-center">
                    Нет аккаунта? <a href="/register">Зарегистрироваться</a>
                </p>
                <p class="text-center">
                    <a href="/items">Вернуться на витрину</a>
                </p>
            </div>
        </div>
    </div>
</body>

</html>
