spring.application.name=my-market-app

# R2DBC (H2 in memory by default, PostgreSQL via env in prod/Docker)
spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:h2:mem:///market}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:sa}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:}

# Schema initialization (R2DBC has no ddl-auto, schema.sql is applied)
spring.sql.init.mode=always

# HTTP-сервер
server.port=${APP_PORT:8080}

# Реактивный кеш каталога (Redis)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# TTL кеша товаров и страниц каталога
app.cache.item-ttl=${CACHE_ITEM_TTL:10m}

# REST-сервис платежей
app.payments.base-url=${PAYMENTS_BASE_URL:http://localhost:8081}
# Тайм-аут ожидания ответа сервиса платежей (connect + response)
app.payments.timeout=${PAYMENTS_TIMEOUT:5s}

# OAuth2 Client Credentials для обращения к сервису платежей
spring.security.oauth2.client.provider.auth-server.token-uri=${AUTH_TOKEN_URI:http://localhost:9000/oauth2/token}
spring.security.oauth2.client.registration.payment-service.provider=auth-server
spring.security.oauth2.client.registration.payment-service.client-id=${AUTH_STOREFRONT_CLIENT_ID:storefront}
spring.security.oauth2.client.registration.payment-service.client-secret=${AUTH_STOREFRONT_CLIENT_SECRET:storefront-secret}
spring.security.oauth2.client.registration.payment-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.payment-service.scope=payment.read,payment.write

# Загрузка демонстрационных данных в пустую витрину
app.seed.enabled=${SEED_DATABASE:true}
app.seed.user.username=${SEED_USERNAME:user}
app.seed.user.password=${SEED_PASSWORD:password}

# Активный профиль по умолчанию
spring.profiles.active=dev
